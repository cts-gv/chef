# Publishes the `staging` branch to GitHub Pages so you can look at changes
# before they go live. Production (main) is built and hosted by Cloudflare.
name: Preview on GitHub Pages
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          NOINDEX: "1"                      # keep the preview out of Google
          SITE_URL: https://YOUR-DOMAIN.com # leave as the real production address
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
